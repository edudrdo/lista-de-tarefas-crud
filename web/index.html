<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lista de Tarefas</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <h1>Lista de Tarefas</h1>

    <div id="aviso">Não foi possível conectar à API. O servidor está rodando?</div>
    <div id="mensagem"></div>

    <!-- Adicionar tarefa -->
    <form id="form">
      <input type="text" id="titulo" placeholder="Escreva a tarefa" maxlength="100" autocomplete="off">
      <button type="submit" class="btn-add">Adicionar</button>
    </form>

    <!-- Ver tarefas -->
    <ul id="lista"></ul>
  </div>

  <script src="script.js"></script>
</body>
</html>
